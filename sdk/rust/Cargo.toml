workspace = { }

[package]
name = "quorum-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generated Quorum Rust client"

[features]
fetch = [ "dep:solana-rpc-client" ]

[dependencies]
num-traits = "0.2.19"
borsh = "^1.0"
solana-account = "~3.0"
solana-account-info = "~3.1"
solana-instruction = "~3.2"
solana-program-error = "~3.0"
solana-cpi = "~3.1"
num-derive = "^0.4"
thiserror = "^1.0"

  [dependencies.solana-address]
  features = [ "borsh", "copy", "curve25519", "decode" ]
  version = "~2.2"

  [dependencies.solana-rpc-client]
  optional = true
  version = "^3.0"
