        target: operator.json
  consumer-2:
    <<: *worker
    depends_on: {rpc: {condition: service_healthy}}
    command: [node, consumer.mjs]
    env_file: [.state/consumer-2.env]
    volumes:
      - ./.state/runtime/consumer-2:/state/consumer-2
      - ./.state/config.json:/state/config.json:ro
      - ./.state/control:/control:ro
    secrets:
      - source: consumer-2-key
        target: operator.json
  consumer-3:
    <<: *worker
    depends_on: {rpc: {condition: service_healthy}}
    command: [node, consumer.mjs]
    env_file: [.state/consumer-3.env]
    volumes:
      - ./.state/runtime/consumer-3:/state/consumer-3
      - ./.state/config.json:/state/config.json:ro
      - ./.state/control:/control:ro
    secrets:
      - source: consumer-3-key
        target: operator.json
  web:
    image: quorum-devnet-fleet:local
    pull_policy: never
    user: "${FLEET_UID:-1000}:${FLEET_GID:-1000}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, web.mjs]
    depends_on: {rpc: {condition: service_healthy}}
    environment:
      WEB_ROOT: /site
      RPC_URL: http://rpc:8799
    ports: ["127.0.0.1:${FLEET_WEB_PORT:-18880}:8080"]
    volumes:
      - ../../demo-site/dist:/site:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  coordinator-key: {file: .state/keys/coordinator.json}
  producer-marginfi-1-key: {file: .state/keys/producer-marginfi-1.json}
  producer-marginfi-2-key: {file: .state/keys/producer-marginfi-2.json}
  producer-marginfi-3-key: {file: .state/keys/producer-marginfi-3.json}
  producer-save-1-key: {file: .state/keys/producer-save-1.json}
  producer-save-2-key: {file: .state/keys/producer-save-2.json}
  producer-save-3-key: {file: .state/keys/producer-save-3.json}
  producer-kamino-1-key: {file: .state/keys/producer-kamino-1.json}
  producer-kamino-2-key: {file: .state/keys/producer-kamino-2.json}
  producer-kamino-3-key: {file: .state/keys/producer-kamino-3.json}
  consumer-1-key: {file: .state/keys/consumer-1.json}
  consumer-2-key: {file: .state/keys/consumer-2.json}
  consumer-3-key: {file: .state/keys/consumer-3.json}
