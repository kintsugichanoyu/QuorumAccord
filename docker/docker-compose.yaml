name: quorum-workers

x-worker: &worker
  image: ${QUORUM_WORKERS_IMAGE:-quorum-workers:local}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  # Compose file secrets preserve host ownership; run as the key file's owner.
  user: "${QUORUM_WORKER_UID:-1000}:${QUORUM_WORKER_GID:-1000}"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  producer:
    <<: *worker
    profiles: [producer]
    entrypoint: ["/usr/local/bin/quorum-producer"]
    env_file:
      - path: producer.env
        required: false
    environment:
      KEYPAIR_FILE: /run/secrets/operator-keypair.json
    secrets:
      - source: producer-keypair
        target: operator-keypair.json

  consumer:
    <<: *worker
    profiles: [consumer]
    entrypoint: ["/usr/local/bin/quorum-consumer"]
    env_file:
      - path: consumer.env
        required: false
    environment:
      KEYPAIR_FILE: /run/secrets/operator-keypair.json
    secrets:
      - source: consumer-keypair
        target: operator-keypair.json

secrets:
  producer-keypair:
    file: secrets/producer.json
  consumer-keypair:
    file: secrets/consumer.json
