[book]
title = "Quorum · Integration Handbook"
authors = ["Quorum contributors"]
language = "en"
src = "src"
description = "Protocol integration, consensus feeds and TypeScript verification for Quorum."

[build]
build-dir = "build"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/quorum.css"]
additional-js = [".generated/inspector.js"]
no-section-label = true
hash-files = true

[output.html.playground]
runnable = false
copyable = true

[output.html.search]
enable = true
use-boolean-and = true

[output.html.redirect]
"/ROADMAP.html" = "roadmap.html"
"/integrations/kamino/README.html" = "../../protocols/kamino.html"
"/testing/devnet/RESULTS.html" = "../../verification.html"
"/docs/book/README.html" = "../../quickstart.html"
