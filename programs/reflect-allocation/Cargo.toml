[package]
name = "reflect-allocation"
version = "0.1.0"
description = "Decentralised capital-allocation oracle + consensus program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reflect_allocation"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
